<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Carte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
<div id="map"></div>
<script>
const map = L.map("map").setView([47.8, -1.5], 7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

// Seuils fixes sur la part de lieux-dits bretons (0 à 1)
const seuils  = [0.05, 0.15, 0.30, 0.50, 0.75];
const palette = ["#ffffcc", "#ffeda0", "#fed976", "#fd8d3c", "#e31a1c", "#800026"];
// 6 couleurs pour 5 seuils : < 5 %, 5-15 %, 15-30 %, 30-50 %, 50-75 %, > 75 %

function couleur(p) {
  if (p.share == null || p.reliable === false) return "#cccccc";   // pas assez de données
  const i = seuils.findIndex(s => p.share < s);
  return i === -1 ? palette.at(-1) : palette[i];
}

fetch("sortie/carte.geojson").then(r => r.json()).then(data => {
  L.geoJSON(data, {
    style: f => ({ fillColor: couleur(f.properties),
                   fillOpacity: 0.8, color: "#555", weight: 0.3 }),
    onEachFeature: (f, layer) => {
      const p = f.properties;
      layer.bindTooltip(
        `${p.nom}<br>part bretonne : ${p.share != null ? (p.share * 100).toFixed(0) + " %" : "n/a"}` +
        `<br>lieux-dits : ${p.n ?? "?"}${p.reliable === false ? " (peu fiable)" : ""}`
      );
    }
  }).addTo(map);
});

// Légende
const legende = L.control({ position: "bottomright" });
legende.onAdd = () => {
  const div = L.DomUtil.create("div");
  div.style.cssText = "background:white;padding:6px 8px;font:12px sans-serif;line-height:18px";
  const bornes = ["0", ...seuils.map(s => Math.round(s * 100)), "100"];
  div.innerHTML = "<b>Part de lieux-dits bretons</b><br>" +
    palette.map((c, i) =>
      `<i style="background:${c};display:inline-block;width:14px;height:14px;margin-right:6px"></i>` +
      `${bornes[i]}–${bornes[i + 1]} %`).join("<br>") +
    `<br><i style="background:#ccc;display:inline-block;width:14px;height:14px;margin-right:6px"></i>peu de données`;
  return div;
};
legende.addTo(map);
</script>
</body>
</html>
